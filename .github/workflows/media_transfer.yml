name: Cloud Media Transfer (Data Plane)

# Split-Plane architecture (BLUEPRINT.md): the home Control-Plane daemon
# (192.168.1.5) owns the NotebookLM session and text generation. When the
# audio/video artifacts are ready it writes a media_handoffs row and
# dispatches this workflow, which pulls the media straight from Google's
# artifact URLs to Telegram using datacenter bandwidth — the Google session
# NEVER lives here.

on:
  repository_dispatch:
    types: [media_transfer]
  workflow_dispatch:
    inputs:
      handoff_id:
        description: 'media_handoffs row UUID (blank = oldest pending)'
        required: false
        default: ''

jobs:
  transfer:
    name: Transfer Media to Telegram CDN
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install notebooklm-py python-dotenv

      - name: Run Media Transfer Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          HANDOFF="${{ inputs.handoff_id || github.event.client_payload.handoff_id }}"
          python media_transfer_worker.py $HANDOFF
